app:
  baseUrl: https://platform-apps.andreskube.uk

backend:
  baseUrl: https://platform-apps.andreskube.uk
  listen:
    port: 7007
  security:
    headers:
      contentSecurityPolicy:
        directives:
          defaultSrc: ["'self'"]
          scriptSrc: ["'self'", "'unsafe-eval'", "'unsafe-inline'"]
          styleSrc: ["'self'", "'unsafe-inline'", "https:"]
          imgSrc: ["'self'", "data:", "https:"]
          connectSrc: ["'self'", "https:"]
          fontSrc: ["'self'", "https:", "data:"]
          workerSrc: ["'self'", "blob:"]
          objectSrc: ["'none'"]
          frameAncestors: ["'self'"]
          upgradeInsecureRequests: false
  database:
    client: pg
    connection:
      host: ${BACKSTAGE_DB_HOST}
      port: 5432
      user: backstage
      password: ${BACKSTAGE_DB_PASSWORD}

auth:
  environment: production
  providers:
    oidc:
      production:
        metadataUrl: http://keycloak-keycloakx-http.keycloak.svc.cluster.local:80/realms/backstage/.well-known/openid-configuration
        clientId: backstage
        clientSecret: ${KEYCLOAK_CLIENT_SECRET}
        callbackUrl: https://platform-apps.andreskube.uk/api/auth/oidc/handler/frame
        signIn:
          resolvers:
            - resolver: emailMatchingUserEntityProfileEmail